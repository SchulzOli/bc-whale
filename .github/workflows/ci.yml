name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate catalog, plugins and runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/bc-whale/package-lock.json
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bc-whale dependencies
        run: npm --prefix packages/bc-whale ci --ignore-scripts --no-audit --no-fund
      - name: Validate, package and test
        run: npm run verify
      - name: Reject stale packaged runtime
        run: git diff --exit-code -- packages/bc-whale/runtime
